name: Deploy Astro site to Pages

on:
    push:
        branches: ['main']
    workflow_dispatch:

permissions:
    contents: read
    pages: write
    id-token: write

concurrency:
    group: 'pages'
    cancel-in-progress: true

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v5

            - name: Setup pnpm
              uses: pnpm/action-setup@v4

            - name: Setup Node
              uses: actions/setup-node@v5
              with:
                  node-version: '22'
                  cache: pnpm

            - name: Setup Pages
              uses: actions/configure-pages@v5
              id: pages

            - name: Cache build artifacts
              uses: actions/cache@v4
              with:
                  path: |
                      .astro
                      node_modules/.astro
                  key: ${{ runner.os }}-astro-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('**/*.[jt]s', '**/*.[jt]sx', '**/*.astro') }}
                  restore-keys: |
                      ${{ runner.os }}-astro-${{ hashFiles('pnpm-lock.yaml') }}-

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Build with Astro
              run: pnpm build
              env:
                  PUBLIC_DISQUS_NAME: ${{ vars.DISQUS_NAME }}
                  PUBLIC_GA_ID: ${{ vars.GA_ID }}
                  PUBLIC_SITE_URL: ${{ steps.pages.outputs.base_url }}

            - name: Upload artifact
              uses: actions/upload-pages-artifact@v3
              with:
                  path: ./dist

    deploy:
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        runs-on: ubuntu-latest
        needs: build
        steps:
            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v4
